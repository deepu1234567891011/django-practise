<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>student details</h2>
    {% for student in students%}
    <p>Name:{{student.name}}</p>
    <p>Age:{{student.age}}</p>
    <p>Course:{{student.course}}</p>
    <a href="{% url 'Update' student.id%}"><button type="button">Update</button></a>
    <a href="{% url 'Delete' student.id%}"><button type="button">Delete</button></a>
    
    <hr>
    {% empty %}
    <p>No students found</p>
    {% endfor %}
</body>
</html>
